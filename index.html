<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSPD Portal | Los-Santos Police Department</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="#">
        <img
          class="brand-logo"
          src="images/lspd-seal.png"
          width="56"
          height="56"
          alt="Los Santos Police Department"
        >
        <span class="brand-text">Los-Santos Police Department</span>
      </a>
      <nav class="menu">
        <a href="#forms">Подача заявлений</a>
        <a href="#contacts">Контакты</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-overlay"></div>
      <div class="container hero-content">
        <p class="hero-kicker">Служба, честь, закон</p>
        <h1>LSPD набирает и обучает лучших</h1>
        <p class="hero-subtitle">
          Центральный портал департамента полиции Los-Santos
        </p>
      </div>
    </section>

    <section class="section section-cards" id="forms">
      <div class="container cards-grid single-card">
        <a class="card card-2" href="https://forms.gle/nygUXKL1sFCovKsEA" target="_blank" rel="noopener noreferrer" aria-label="Форма: подача заявления">
          <span>Подача заявления</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer" id="contacts">
    <div class="container">
      <p class="footer-main">LSPD Portal - внутренний навигационный сайт</p>
      <p class="footer-note">накодил psina_nahui</p>
    </div>
  </footer>
</body>
</html>
